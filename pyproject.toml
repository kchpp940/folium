[build-system]
requires = ["setuptools>=41.2", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folium"
dynamic = [
    "version",
    "description",
    "readme",
    "license",
    "authors",
    "keywords",
    "classifiers",
    "dependencies",
    "optional-dependencies",
]
requires-python = ">=3.9"

[project.scripts]
folium-resource = "folium.cli:main"

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-module = false
fail-under = 85
exclude = ["setup.py", "docs", "tests"]
verbose = 1
quiet = false
color = true

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
lint.select = [
    "F", # flakes
    "I", # import sorting
    "U", # upgrade
]
target-version = "py39"
line-length = 120

[tool.pytest.ini_options]
markers = ["network: marks tests that require network connectivity"]

[lint.per-file-ignores]
"docs/conf.py" = ["E402"]
