name: Code Tests

on:
  schedule:
    - cron: "0 13 * * *"
  pull_request:
  push:
    branches:
      - main

jobs:
  core:
    name: Core & Plugin Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v6

    - name: Setup Micromamba env
      uses: mamba-org/setup-micromamba@v3
      with:
        micromamba-version: '2.6.0-0'
        environment-name: TEST
        create-args: >-
          python=${{ matrix.python-version }}
          --file requirements.txt
          --file requirements-dev.txt

    - name: Install folium from source
      run: python -m pip install -e . --no-deps --force-reinstall

    - name: Run core and plugin tests
      run: |
        coverage run -p -m pytest tests -vv \
          -m "core or plugins or smoke" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots
        echo "=== Test Selection Summary ==="
        python -m pytest tests --collect-only -q \
          -m "core or plugins or smoke" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots 2>&1 | tail -5

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-test-core-${{ matrix.os }}-${{ matrix.python-version }}
        path: .coverage*
        include-hidden-files: true

  external_data:
    name: External Data Tests
    runs-on: ubuntu-latest
    needs: core
    if: github.event_name == 'schedule' || github.event_name == 'push'
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v6

    - name: Setup Micromamba env
      uses: mamba-org/setup-micromamba@v3
      with:
        micromamba-version: '2.6.0-0'
        environment-name: TEST
        create-args: >-
          python=${{ matrix.python-version }}
          --file requirements.txt
          --file requirements-dev.txt

    - name: Install folium from source
      run: python -m pip install -e . --no-deps --force-reinstall

    - name: Install geodatasets
      run: |
        pip install geodatasets

    - name: Run external data tests
      run: |
        coverage run -p -m pytest tests -vv \
          -m "external_data" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots \
          --run-external-data
        echo "=== Test Selection Summary ==="
        python -m pytest tests --collect-only -q \
          -m "external_data" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots 2>&1 | tail -5

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-test-external-data-${{ matrix.python-version }}
        path: .coverage*
        include-hidden-files: true
