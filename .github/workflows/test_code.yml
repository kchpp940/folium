name: Code Tests

# -----------------------------------------------------------------------------
# Folium CI test tier mapping (see tests/conftest.py for the pytest side)
#
# Tier          | pytest marker | This workflow                 | Runs on
# --------------+---------------+-------------------------------+--------------
# core          | core          | job: core (core + plugins)    | every PR, push, schedule
# plugins       | plugins       | job: core (core + plugins)    | every PR, push, schedule
# external_data | external_data | job: external_data            | push, schedule (opt-in PR via label)
# render        | render        | .github/workflows/test_snapshots.yml  | push, schedule, PR label `run-render`
# selenium      | selenium      | .github/workflows/test_selenium.yml   | push, schedule, PR label `run-selenium`
#
# Coverage artefacts from every job share a common prefix and are merged in a
# dedicated coverage-reports workflow (if added later).
# -----------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 13 * * *"
  pull_request:
  push:
    branches:
      - main

jobs:
  core:
    name: Core & Plugin Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v6

    - name: Setup Micromamba env
      uses: mamba-org/setup-micromamba@v3
      with:
        micromamba-version: '2.6.0-0'
        environment-name: TEST
        create-args: >-
          python=${{ matrix.python-version }}
          --file requirements.txt
          --file requirements-dev.txt

    - name: Install folium from source
      run: python -m pip install -e . --no-deps --force-reinstall

    - name: Marker audit (structural check)
      run: |
        # Fail fast (exit code 4) if any test is missing a category marker
        # or carries gate markers without a category.  This is a collect-only
        # pass – no test code executes here.
        python -m pytest tests --collect-only -q \
          --ignore=tests/selenium \
          --ignore=tests/snapshots

    - name: Run core and plugin tests
      run: |
        # Explicitly select `core or plugins` via -m.  Gate-tagged tests
        # (external_data / render / selenium) that are layered on top are
        # *collected* but automatically SKIPPED by tests/conftest.py's
        # pytest_runtest_setup hook because no --run-* flag is passed.
        # This keeps the default PR pass/fail signal noise-free.
        coverage run -p -m pytest tests -vv \
          -m "core or plugins" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots

    - name: Show test-tier summary
      run: |
        echo "=== Collected default-tier tests (core + plugins) ==="
        python -m pytest tests --collect-only -q \
          -m "core or plugins" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots 2>&1 | tail -10
        echo ""
        echo "=== Skipped gate-tagged tests (require opt-in --run-*) ==="
        python -m pytest tests --collect-only -q \
          -m "external_data or render or selenium" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots 2>&1 | tail -5

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-test-core-${{ matrix.os }}-${{ matrix.python-version }}
        path: .coverage*
        include-hidden-files: true

  external_data:
    name: External Data Tests (geodatasets / network)
    runs-on: ubuntu-latest
    needs: core
    if: github.event_name == 'schedule' || github.event_name == 'push'
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v6

    - name: Setup Micromamba env
      uses: mamba-org/setup-micromamba@v3
      with:
        micromamba-version: '2.6.0-0'
        environment-name: TEST
        create-args: >-
          python=${{ matrix.python-version }}
          --file requirements.txt
          --file requirements-dev.txt

    - name: Install folium from source
      run: python -m pip install -e . --no-deps --force-reinstall

    - name: Install geodatasets
      run: |
        pip install geodatasets

    - name: Marker audit (structural check)
      run: |
        # Fail fast (exit code 4) if any test breaks the marker rules.
        # Same collect-only pass as the core job, just to make sure the
        # structural invariant holds on the external-data matrix as well.
        python -m pytest tests --collect-only -q \
          --ignore=tests/selenium \
          --ignore=tests/snapshots

    - name: Run external data tests
      run: |
        # The marker + the CLI flag are both needed:
        #   -m external_data   → limit collection to this tier
        #   --run-external-data → tell conftest.py NOT to skip these items
        coverage run -p -m pytest tests -vv \
          -m "external_data" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots \
          --run-external-data

    - name: Show external-data test summary
      run: |
        echo "=== Collected external_data tests ==="
        python -m pytest tests --collect-only -q \
          -m "external_data" \
          --ignore=tests/selenium \
          --ignore=tests/snapshots 2>&1 | tail -10

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-test-external-data-${{ matrix.python-version }}
        path: .coverage*
        include-hidden-files: true
