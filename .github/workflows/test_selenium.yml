name: Selenium Tests

# Tier: selenium (browser automation)
# See tests/conftest.py and .github/workflows/test_code.yml for the full matrix.
#
# Triggered on: schedule (daily), push to main, PRs labeled `run-selenium`.
# Needs: selenium + Chrome webdriver (installed by the step below).
# Also passes --run-external-data because some selenium tests (e.g.
# test_geojson_selenium) fetch remote JSON at runtime.

on:
  schedule:
    - cron: "0 13 * * *"
  pull_request:
    types: [ labeled, opened, synchronize, reopened ]
  push:
    branches:
      - main

jobs:
  run:
    name: Selenium Browser Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-selenium')
    strategy:
      matrix:
        python-version: [ "3.9", "3.13" ]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v6

    - name: Setup Micromamba env
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: TEST
        create-args: >-
          python=3
          --file requirements.txt
          --file requirements-dev.txt

    - name: Install folium from source
      run: python -m pip install -e . --no-deps --force-reinstall

    - name: Install selenium and pillow
      run: |
        pip install selenium pillow

    - name: Selenium tests
      run: |
        # Marker filtering happens implicitly (tests/selenium/* is the entry
        # point).  --run-selenium flips conftest.py's skip-gate OFF;
        # --run-external-data is needed because some tests inside this dir
        # also carry that marker (remote JSON).
        coverage run -p -m pytest tests/selenium -vv \
          --run-selenium \
          --run-external-data
        echo "=== Collected selenium-tier tests ==="
        python -m pytest tests/selenium --collect-only -q \
          --run-selenium 2>&1 | tail -10

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-test-selenium-${{ matrix.python-version }}
        path: |
          .coverage*
        include-hidden-files: true
