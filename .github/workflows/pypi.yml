name: Publish to PyPI

on:
  schedule:
    - cron: "0 13 * * *"
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

defaults:
  run:
    shell: bash

jobs:
  pre-release-tests:
    name: Pre-release Full Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'schedule'
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v6

    - name: Setup Micromamba env
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: TEST
        create-args: >-
          python=3.11
          --file requirements.txt
          --file requirements-dev.txt

    - name: Install test dependencies
      run: |
        pip install geodatasets pixelmatch selenium pillow

    - name: Install folium from source
      run: python -m pip install -e . --no-deps --force-reinstall

    - name: Run release resource audit
      run: python -m folium.release_audit --strict

    - name: Run full test suite (all markers)
      run: |
        coverage run -p -m pytest tests -vv \
          --run-all \
          --junit-xml=test-results.xml

    - name: Surface failing tests
      if: always()
      uses: pmeier/pytest-results-action@main
      with:
        path: test-results.xml
        fail-on-empty: false

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-pre-release
        path: |
          .coverage*
        include-hidden-files: true

  packages:
    needs: pre-release-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Get tags
      run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*


    - name: Install build tools
      run: |
        python -m pip install --upgrade pip wheel build twine

    - name: Build binary wheel and sdist
      run: python -m build --sdist --wheel . --outdir dist

    - name: CheckFiles
      run: |
        ls dist

    - name: Test wheels
      run: |
        cd dist && python -m pip install folium*.whl
        python -m twine check *

    - name: Publish a Python distribution to PyPI
      if: success() && github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        user: __token__
        password: ${{ secrets.PYPI_PASSWORD }}
