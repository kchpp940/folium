[tox]
envlist = marker-audit, py, py-external, py-render, py-selenium, py-all
skip_missing_interpreters = true
minversion = 4.0

# -----------------------------------------------------------------------------
# Test tier matrix
# -----------------------------------------------------------------------------
# Env            | markers collected          | --run flags passed
# ----------------+----------------------------+------------------------
# marker-audit   | all (collect-only, no-run) | N/A – hard-fails if any
#                |                            |       item breaks rules
# py (default)   | core + plugins             | none → gate-tagged are SKIPPED
# py-external    | core + plugins + ext_data  | --run-external-data
# py-render      | snapshots/                 | --run-render --run-selenium --run-external-data
# py-selenium    | selenium/                  | --run-selenium --run-external-data
# py-all         | all                        | --run-all
# quick          | core + plugins (fast mode) | none, compact output
# release-check  | all + mypy                 | --run-all + mypy
#
# The marker-audit environment is the SINGLE source of truth for the
# structural invariant.  All other envs declare `depends = marker-audit`
# so that `tox` (without -e) always runs the audit first.
# -----------------------------------------------------------------------------

[testenv:marker-audit]
description =
    Static marker-audit pass (no test execution).  Enforces that every
    test carries exactly one category marker and that gate markers are
    only used as overlays.  Failures here are STRUCTURAL (missing/extra
    marker), not real test regressions.
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements-dev.txt
setenv =
    PYTHONDONTWRITEBYTECODE = 1
commands =
    pip install -e . --no-deps --force-reinstall
    python {toxinidir}/scripts/marker-audit

[testenv]
description =
    py:            Default – run stable, offline tests (core + plugins). Gate-tagged tests are SKIPPED.
    py-external:   Default + tests needing geodatasets / network (--run-external-data).
    py-render:     PNG pixelmatch snapshot tests (needs selenium + pixelmatch + pillow).
    py-selenium:   Browser automation tests (needs selenium + Chrome).
    py-all:        Every test – equivalent to --run-all.
depends = marker-audit
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements-dev.txt
    external: geodatasets
    render: pixelmatch pillow selenium
    selenium: selenium pillow
passenv = *
setenv =
    PYTHONDONTWRITEBYTECODE = 1
commands =
    pip install -e . --no-deps --force-reinstall
    py:          pytest tests -vv --ignore=tests/selenium --ignore=tests/snapshots {posargs}
    py-external: pytest tests -vv --ignore=tests/selenium --ignore=tests/snapshots --run-external-data {posargs}
    py-render:   pytest tests/snapshots -vv --run-render --run-selenium --run-external-data {posargs}
    py-selenium: pytest tests/selenium -vv --run-selenium --run-external-data {posargs}
    py-all:      pytest tests -vv --run-all {posargs}

[testenv:quick]
description =
    Fastest offline verification: core + plugins, compact output, no gate-tagged tests.
    Intended for the "red / green" inner dev loop (< 10 s on a warm machine).
depends = marker-audit
commands =
    pip install -e . --no-deps --force-reinstall
    pytest tests -q --tb=short \
        --ignore=tests/selenium \
        --ignore=tests/snapshots \
        -m "not external_data and not render and not selenium" {posargs}

[testenv:release-check]
description =
    Pre-release gate: every test tier + mypy type-checking.  Run this before
    tagging a release or merging into main if you want to be extra safe.
depends = marker-audit
deps =
    {[testenv]deps}
    geodatasets
    pixelmatch
    pillow
    selenium
    mypy
commands =
    pip install -e . --no-deps --force-reinstall
    pytest tests -vv --run-all {posargs}
    mypy folium

[flake8]
max-line-length = 120
exclude = .git,__pycache__,build,dist,docs,.eggs
ignore = E402,E203,W503

[coverage:run]
source = folium
omit =
    */tests/*
    */setup.py
    */folium/__init__.py

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 70
