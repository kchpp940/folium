[tox]
envlist = py, py-external, py-render, py-selenium, py-all
skip_missing_interpreters = true
minversion = 4.0

[testenv]
description =
    py: Run default tests (core + plugins) - fast, stable
    py-external: Run tests requiring external data (geodatasets, network)
    py-render: Run PNG rendering tests with pixelmatch
    py-selenium: Run browser automation tests
    py-all: Run all tests
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements-dev.txt
    external: geodatasets
    render: pixelmatch pillow
    selenium: selenium pillow
passenv = *
setenv =
    PYTHONDONTWRITEBYTECODE = 1
commands =
    pip install -e . --no-deps --force-reinstall
    py: pytest tests -vv --ignore=tests/selenium --ignore=tests/snapshots {posargs}
    py-external: pytest tests -vv --ignore=tests/selenium --ignore=tests/snapshots --run-external-data {posargs}
    py-render: pytest tests/snapshots -vv --run-render --run-selenium --run-external-data {posargs}
    py-selenium: pytest tests/selenium -vv --run-selenium --run-external-data {posargs}
    py-all: pytest tests -vv --run-all {posargs}

[testenv:quick]
description = Run only the fastest core tests (<10s total)
commands =
    pip install -e . --no-deps --force-reinstall
    pytest tests -vv -m "core and not render and not selenium and not external_data" --ignore=tests/selenium --ignore=tests/snapshots {posargs}

[testenv:release-check]
description = Full pre-release verification - all tests + type checking
deps =
    {[testenv]deps}
    mypy
commands =
    pip install -e . --no-deps --force-reinstall
    pytest tests -vv --run-all {posargs}
    mypy folium

[flake8]
max-line-length = 120
exclude = .git,__pycache__,build,dist,docs,.eggs
ignore = E402,E203,W503

[coverage:run]
source = folium
omit =
    */tests/*
    */setup.py
    */folium/__init__.py

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 70
